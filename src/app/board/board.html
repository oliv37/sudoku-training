<!-- Layers in drawing order: in SVG, what comes later is painted on top. -->
<svg [attr.viewBox]="viewBox" class="block h-auto w-full" role="img" [attr.aria-label]="label()">
  <defs>
    <pattern
      [attr.id]="hatchId"
      width="14"
      height="14"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect width="14" height="14" [attr.fill]="hatchBackground" opacity="0.55" />
      <line
        x1="0"
        y1="0"
        x2="0"
        y2="14"
        [attr.stroke]="hatchLine"
        stroke-width="2.2"
        opacity="0.55"
      />
    </pattern>
  </defs>

  <rect
    x="0"
    y="0"
    [attr.width]="gridSize"
    [attr.height]="gridSize"
    [attr.fill]="theme.background"
  />

  <g appBoardGridLines [lines]="boardScene().lines"></g>
  <!-- Zones, drawn over the grid lines (their backgrounds keep the lines visible) -->
  <g appBoardZones [zones]="boardScene().zones" [hatchUrl]="hatchUrl"></g>
  <g appBoardDigits [digits]="boardScene().digits"></g>
  <g appBoardCandidates [candidates]="boardScene().candidates"></g>
  <g appBoardArrows [arrows]="arrowsScene().arrows" [badges]="arrowsScene().badges"></g>
</svg>
