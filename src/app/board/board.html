<!-- Layers in drawing order: in SVG, what comes later is painted on top. -->
<svg [attr.viewBox]="viewBox" class="block h-auto w-full" role="img" [attr.aria-label]="label()">
  <defs>
    <pattern
      [attr.id]="hatchId"
      width="14"
      height="14"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect width="14" height="14" [attr.fill]="theme.badBg" opacity="0.55" />
      <line
        x1="0"
        y1="0"
        x2="0"
        y2="14"
        [attr.stroke]="theme.bad"
        stroke-width="2.2"
        opacity="0.55"
      />
    </pattern>
  </defs>

  <rect
    x="0"
    y="0"
    [attr.width]="gridSize"
    [attr.height]="gridSize"
    [attr.fill]="theme.background"
  />

  <g appBoardGridLines [lines]="boardScene().lines"></g>
  <!-- Question marks, drawn over the grid lines (their backgrounds keep the lines visible) -->
  @if (boardScene().redZone; as redZone) {
    <g appBoardRedZone [redZone]="redZone" [hatchUrl]="hatchUrl"></g>
  }
  @if (boardScene().start; as start) {
    <g appBoardStartCell [start]="start"></g>
  }
  <g appBoardValues [values]="boardScene().values"></g>
  <g appBoardCandidates [candidates]="boardScene().candidates"></g>
  @if (shownSolutionScene(); as scene) {
    <g appBoardSolutionDiagram [scene]="scene"></g>
  }
</svg>
