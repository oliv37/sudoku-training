<!-- Elements prefixed with `svg:`: this template has no <svg> ancestor, so without the prefix
     Angular would create HTML elements, which the browser does not draw. -->
@for (candidate of candidates(); track candidate.key) {
  <svg:text
    [attr.x]="candidate.x"
    [attr.y]="candidate.textY"
    text-anchor="middle"
    [attr.fill]="candidate.greyed ? theme.greyedCandidate : theme.candidate"
    font-family="Barlow"
    font-weight="600"
    font-size="23"
  >
    {{ candidate.digit }}
  </svg:text>
  @if (candidate.underlined) {
    <svg:line
      [attr.x1]="candidate.underline.x1"
      [attr.y1]="candidate.underline.y1"
      [attr.x2]="candidate.underline.x2"
      [attr.y2]="candidate.underline.y2"
      [attr.stroke]="candidate.greyed ? theme.greyedCandidate : theme.underline"
      stroke-width="2.4"
      stroke-linecap="round"
    />
  }
  <!-- Drawn over its digit: `mix-blend-multiply` multiplies the frame's colors with what lies
       under it, so the digit stays dark and readable instead of being hidden by the frame. -->
  @if (candidate.frame; as frame) {
    <svg:rect
      [attr.x]="frame.x"
      [attr.y]="frame.y"
      [attr.width]="frame.size"
      [attr.height]="frame.size"
      rx="5"
      [attr.fill]="frame.background"
      [attr.stroke]="frame.color"
      stroke-width="1.5"
      class="mix-blend-multiply"
      [attr.display]="frame.hidden ? 'none' : null"
    />
  }
  @if (candidate.strike; as strike) {
    <svg:line
      [attr.x1]="strike.x1"
      [attr.y1]="strike.y1"
      [attr.x2]="strike.x2"
      [attr.y2]="strike.y2"
      [attr.stroke]="candidate.greyed ? theme.greyedCandidate : strike.color"
      [attr.stroke-width]="candidate.greyed ? 2 : 3"
      stroke-linecap="round"
      [attr.display]="strike.hidden ? 'none' : null"
    />
  }
  @if (candidate.circle; as circle) {
    <svg:circle
      [attr.cx]="candidate.x"
      [attr.cy]="candidate.y"
      r="14"
      fill="none"
      [attr.stroke]="circle.color"
      [attr.stroke-width]="circle.bold ? 3.6 : 3"
      [attr.display]="circle.hidden ? 'none' : null"
    />
  }
}
