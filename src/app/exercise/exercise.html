<!-- The store gets the exercise from the input before the first render: this @if only narrows the type. -->
@if (store.question(); as question) {
  <!-- Above the board on phones, top of the right column on wide landscape screens -->
  <app-exercise-nav
    class="flex-none md:landscape:col-start-2 md:landscape:row-start-1"
    [name]="store.exerciseName()"
    [questionNumber]="question.coup"
    [questionCount]="store.questionCount()"
    [hasPrevious]="store.hasPrevious()"
    [hasNext]="store.hasNext()"
    (previous)="store.previous()"
    (next)="store.next()"
  />

  <!-- Left column on wide landscape screens: as wide as the height allows, minus room for the
       right column (20rem) and the gap -->
  <app-exercise-board
    class="flex min-h-0 shrink flex-col md:landscape:col-start-1 md:landscape:row-span-full md:landscape:row-start-1 md:landscape:h-full md:landscape:w-[min(100cqh,calc(100cqw-20rem-2.5rem))] md:landscape:justify-center"
    [question]="question"
    [solution]="store.solution()"
    [step]="store.shownStep()"
  />

  <app-move />
}
