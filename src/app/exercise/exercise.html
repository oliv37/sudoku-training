<!-- The store gets the exercise from the input before the first render: this @if only narrows the type. -->
@if (store.move(); as move) {
  <!-- Move navigation: above the board on phones, top of the right column on wide landscape screens -->
  <div class="flex-none md:landscape:col-start-2 md:landscape:row-start-1">
    <nav
      aria-label="Moves"
      class="flex flex-none items-center justify-center gap-3 font-mono text-xs tracking-wider text-muted uppercase md:landscape:text-sm"
    >
      <button
        type="button"
        class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-navy transition-colors hover:bg-line/40 focus-visible:outline-2 focus-visible:outline-chain disabled:cursor-default disabled:opacity-30 disabled:hover:bg-transparent"
        aria-label="Previous move"
        [disabled]="!store.hasPrevious()"
        (click)="store.previous()"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          class="size-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </button>

      <p class="tabular-nums" aria-hidden="true">
        {{ store.exerciseName() }} ·
        <span class="inline-block text-right" [style.width.ch]="store.counterWidth()">{{
          move.coup
        }}</span>
        / {{ store.moveCount() }}
      </p>
      <p class="sr-only" aria-live="polite">Move {{ move.coup }} of {{ store.moveCount() }}</p>

      <button
        type="button"
        class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-navy transition-colors hover:bg-line/40 focus-visible:outline-2 focus-visible:outline-chain disabled:cursor-default disabled:opacity-30 disabled:hover:bg-transparent"
        aria-label="Next move"
        [disabled]="!store.hasNext()"
        (click)="store.next()"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          class="size-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
    </nav>
  </div>

  <app-move [move]="move" [hasNext]="store.hasNext()" (next)="store.next()" />
}
