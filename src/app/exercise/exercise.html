<!-- Move navigation: above the board on phones, top of the right column on wide landscape screens -->
<div class="flex-none md:landscape:col-start-2 md:landscape:row-start-1">
  <nav
    aria-label="Moves"
    class="flex flex-none items-center justify-center gap-3 font-mono text-xs tracking-wider text-muted uppercase md:landscape:text-sm"
  >
    <button
      type="button"
      class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-navy transition-colors hover:bg-line/40 focus-visible:outline-2 focus-visible:outline-chain disabled:cursor-default disabled:opacity-30 disabled:hover:bg-transparent"
      aria-label="Previous move"
      [disabled]="!hasPrevious()"
      (click)="previous()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        class="size-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 6l-6 6 6 6" />
      </svg>
    </button>

    <p class="tabular-nums" aria-hidden="true">
      {{ grid().nom }} ·
      <span class="inline-block text-right" [style.width.ch]="counterWidth()">{{
        move().coup
      }}</span>
      / {{ total() }}
    </p>
    <p class="sr-only" aria-live="polite">Move {{ move().coup }} of {{ total() }}</p>

    <button
      type="button"
      class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-navy transition-colors hover:bg-line/40 focus-visible:outline-2 focus-visible:outline-chain disabled:cursor-default disabled:opacity-30 disabled:hover:bg-transparent"
      aria-label="Next move"
      [disabled]="!hasNext()"
      (click)="next()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        class="size-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>
  </nav>
</div>

<app-move [move]="move()" [hasNext]="hasNext()" (next)="next()" />
