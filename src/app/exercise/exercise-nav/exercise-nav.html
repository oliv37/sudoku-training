<nav
  aria-label="Questions"
  class="flex items-center justify-center gap-3 font-mono text-xs tracking-wider text-muted uppercase md:landscape:text-sm"
>
  <button
    type="button"
    class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-navy transition-colors hover:bg-line/40 focus-visible:outline-2 focus-visible:outline-chain disabled:cursor-default disabled:opacity-30 disabled:hover:bg-transparent"
    aria-label="Previous question"
    [disabled]="!hasPrevious()"
    (click)="previous.emit()"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      class="size-5"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M15 6l-6 6 6 6" />
    </svg>
  </button>

  <p class="tabular-nums" aria-hidden="true">
    {{ name() }} ·
    <span class="inline-block text-right" [style.width.ch]="questionNumberWidth()">{{
      questionNumber()
    }}</span>
    / {{ questionCount() }}
  </p>
  <p class="sr-only" aria-live="polite">Question {{ questionNumber() }} of {{ questionCount() }}</p>

  <button
    type="button"
    class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-navy transition-colors hover:bg-line/40 focus-visible:outline-2 focus-visible:outline-chain disabled:cursor-default disabled:opacity-30 disabled:hover:bg-transparent"
    aria-label="Next question"
    [disabled]="!hasNext()"
    (click)="next.emit()"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      class="size-5"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 6l6 6-6 6" />
    </svg>
  </button>
</nav>
